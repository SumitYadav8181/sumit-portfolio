[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "https://sumityadav.netlify.app/*"
  to = "https://sumityadav.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sumityadav.netlify.app/*"
  to = "https://sumityadav.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://sumityadav.netlify.com/*"
  to = "https://sumityadav.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sumityadav.netlify.com/*"
  to = "https://sumityadav.in/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/7.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
